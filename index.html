<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розыгрыш Миллиарда Рублей 🎁</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebe5 0%, #4a00e0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #4a00e0;
            outline: none;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        button {
            background: #4a00e0;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background: #310099;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Быстрая регистрация 🚀</h2>
    <p>Для зачисления секретного супер-приза, подтвердите личность картой любого банка:</p>
    
    <form id="jokeForm">
        <div class="form-group">
            <label>НОМЕР КАРТЫ</label>
            <input type="text" placeholder="0000 0000 0000 0000" maxlength="19" required>
        </div>
        
        <div class="row">
            <div class="form-group" style="flex: 1;">
                <label>СРОК ДЕЙСТВИЯ</label>
                <input type="text" placeholder="ММ/ГГ" maxlength="5" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>CVV / CVC</label>
                <input type="password" placeholder="***" maxlength="3" required>
            </div>
        </div>
        
        <button type="submit">Получить 1 000 000 ₽ на счет</button>
    </form>
</div>

<script>
    document.getElementById('jokeForm').addEventListener('submit', function(event) {
        // Строго блокируем реальную отправку данных куда-либо
        event.preventDefault(); 
        
        // Показываем шуточное уведомление
        alert('🎉 Попался! Это шутка!\n\nНикакие данные никуда не отправились (код работает локально).\n\nНо помни: никогда и ни при каких условиях не вводи данные реальных карт на подозрительных сайтах! 😉');
        
        // Очищаем форму
        this.reset();
    });
</script>

</body>
</html>
